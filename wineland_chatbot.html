<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>와인랜드 VIP 소믈리에</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#f0ece4;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
#api-key-input:focus{border-color:#3C3489}
#app{width:100%;max-width:700px;height:680px;display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.12)}
#hdr{padding:14px 18px;background:#3C3489;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
#hdr h1{font-size:15px;font-weight:600;color:#EEEDFE}
#hdr p{font-size:11px;color:rgba(238,237,254,0.65)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.bub{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.65;max-width:82%}
.bot .bub{background:#f0ede8;color:#222;border-bottom-left-radius:4px}
.user .bub{background:#3C3489;color:#fff;border-bottom-right-radius:4px}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.bav{background:#3C3489}.uav{background:#e0daf5}

/* 선물 카드 */
.gcard{background:#fff;border:1px solid #f5e8d0;border-left:3px solid #C8860A;border-radius:10px;padding:10px 13px;margin-top:8px;cursor:pointer;transition:box-shadow .15s,background .15s}
.gcard:hover{background:#fffdf7;box-shadow:0 2px 8px rgba(200,134,10,0.15)}
.gcard .wn{color:#222}
.gcard .wi{color:#C8860A}
/* 벌크 카드 */
.wcard{background:#fff;border:1px solid #ede8f5;border-left:3px solid #534AB7;border-radius:10px;padding:10px 13px;margin-top:8px;cursor:pointer;transition:box-shadow .15s,background .15s}
.wcard:hover{background:#faf8ff;box-shadow:0 2px 8px rgba(83,74,183,0.15)}
.wcard .wi{color:#534AB7}
.wn{font-weight:600;font-size:13px;color:#222;margin-bottom:3px}
.wi{font-size:12px;margin-bottom:4px}
.wt{font-size:12px;color:#666;line-height:1.5}
.wcard-hint{font-size:10px;color:#aaa;margin-top:5px;text-align:right}

/* 모달 */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:16px}
#modal-bg.show{display:flex}
#modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.25)}
#modal-hdr{padding:16px 18px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#modal-hdr.gift-hdr{background:#C8860A}
#modal-hdr.bulk-hdr{background:#3C3489}
#modal-title{font-size:14px;font-weight:600;color:#fff;line-height:1.4}
#modal-close{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#modal-close:hover{background:rgba(255,255,255,0.35)}
#modal-body{padding:18px}
.mrow{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #f0ede8}
.mrow:last-child{border-bottom:none}
.mlabel{font-size:11px;color:#999;min-width:72px;padding-top:2px;font-weight:500}
.mvalue{font-size:13px;color:#222;line-height:1.6;flex:1}
.mbadge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#EEEDFE;color:#3C3489;font-weight:500;margin-right:4px;margin-bottom:2px}
.mbadge.gold{background:#FFF3D6;color:#C8860A}
.mprice-box{display:flex;flex-direction:column;gap:5px}
.mprice-row{display:flex;justify-content:space-between;align-items:center}
.mprice-label{font-size:11px;color:#999}
.mprice-val{font-size:14px;font-weight:600;color:#3C3489}
.mprice-val.main{font-size:17px;color:#A32D2D}
.mprice-val.gold{color:#C8860A}
.minfo-box{font-size:11px;background:#f9f5eb;border:1px solid #f0e0b0;border-radius:6px;padding:7px 10px;margin-top:8px;line-height:1.6;color:#6b5a2e}

.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid #f0ede8;background:#faf8f5;flex-shrink:0}
.chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #d5cce8;background:#fff;color:#534AB7;cursor:pointer;white-space:nowrap}
.chip:hover{background:#eeedfe}
.chip.gold{border-color:#e8c97a;color:#C8860A}
.chip.gold:hover{background:#fffdf0}
#irow{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee;flex-shrink:0}
#inp{flex:1;padding:10px 16px;font-size:14px;border-radius:24px;border:1px solid #d5cce8;background:#faf8f5;color:#222;outline:none}
#inp:focus{border-color:#3C3489;background:#fff}
#inp:disabled{opacity:.5;cursor:not-allowed}
#sbtn{padding:10px 18px;background:#3C3489;color:#fff;border:none;border-radius:24px;cursor:pointer;font-size:14px}
#sbtn:hover{background:#534AB7}
#sbtn:disabled{background:#bbb;cursor:not-allowed}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#999;animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="logo">🍷</div>
    <div>
      <h1>와인랜드 VIP 소믈리에</h1>
      <p>선물세트 · 벌크와인 · 가격 · 테이스팅노트 · 페어링 안내</p>
    </div>
  </div>
  <div id="msgs"></div>
  <div class="chips">
    <div class="chip gold" onclick="sc(this.textContent)">🎁 선물용 추천</div>
    <div class="chip gold" onclick="sc(this.textContent)">🎁 5만원 이하 선물</div>
    <div class="chip" onclick="sc(this.textContent)">레드와인 추천</div>
    <div class="chip" onclick="sc(this.textContent)">VIP 2만원 이하</div>
    <div class="chip" onclick="sc(this.textContent)">스테이크 페어링</div>
    <div class="chip" onclick="sc(this.textContent)">배송 안내</div>
  </div>
  <div id="irow">
    <input id="inp" placeholder="가격·품종·페어링·선물 등 무엇이든 물어보세요..."
           onkeydown="if(event.key==='Enter')sm()"/>
    <button id="sbtn" onclick="sm()">전송</button>
  </div>
</div>
<div id="modal-bg">
  <div id="modal">
    <div id="modal-hdr">
      <div id="modal-title"></div>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

## 답변 규칙
- 한국어로 친근하고 전문적으로 답변
- 선물세트 가격 안내 시 반드시 price_a 필드 값을 사용 (예: price_a가 44000이면 "44,000원"으로 안내)
- consumer_price나 price_b는 절대 안내하지 말 것, 오직 price_a만 안내
- 선물세트 예산 필터링도 반드시 price_a 기준으로 판단 (예: "5만원 이상" → price_a >= 50000인 상품만 추천, "5만원 이하" → price_a <= 50000인 상품만 추천)
- price_a가 예산 조건을 벗어난 상품은 절대 추천하지 말 것
- 벌크 가격 안내 시 VIP 현금가(vip_price) 기준, VAT별도 명시
- 배송비 안내: 6,000원, 10만원 이상 무료, 묶음배송 가능

## 예산+수량 추천 로직
고객이 "N만원으로 M병 추천"처럼 총예산과 수량을 함께 말할 경우:
- [시스템 사전계산 결과]가 메시지에 포함되어 있으면, 그 와인 목록을 그대로 추천하고 각 와인 특징을 간결하게 설명
- 반드시 목록에 있는 모든 와인을 빠짐없이 설명하고 합계 금액을 안내
- 국가별 배분 비율이나 순위는 고객에게 설명하지 않음
- 각 와인 설명은 와인명 + 가격 + 핵심 특징 1~2문장으로 간결하게
- 답변이 끊기지 않도록 모든 와인을 완성해서 안내`;



// ── ID 파싱 ───────────────────────────────────────────
function extractIds(reply){
  var gm=reply.match(/\[GIFT_IDS:([^\]]*?)\]/);
  var wm=reply.match(/\[WINE_IDS:([^\]]*?)\]/);
  var gifts=[];
  var wines=[];
  if(gm&&gm[1]){
    gm[1].split(',').forEach(function(s){var t=s.trim();if(t&&GIFT_MAP[t])gifts.push(GIFT_MAP[t]);});
  }
  if(wm&&wm[1]){
    wm[1].split(',').forEach(function(s){var n=parseInt(s.trim(),10);if(!isNaN(n)&&WINE_MAP[n])wines.push(WINE_MAP[n]);});
  }
  return {gifts:gifts.slice(0,5), wines:wines.slice(0,15)};
}
function cleanReply(r){return r.replace(/\[GIFT_IDS:[^\]]*?\]/,'').replace(/\[WINE_IDS:[^\]]*?\]/,'').trim();}

async function call(msg, displayMsg){
  hist.push({role:'user',content:msg});
  addTyping();sbtnEl.disabled=true;
  try{
    var res=await fetch('/api/chat',{
      method:'POST',

    });
    if(!res.ok){var e=await res.json().catch(function(){return{};});throw new Error((e.error&&e.error.message)||'HTTP '+res.status);}

  }finally{sbtnEl.disabled=false;inpEl.focus();}
}


// ── 예산+수량 감지 및 최적 조합 계산 ────────────────────
function detectBudgetQuery(msg) {
  // "15만원 10병", "150000원으로 6병", "15만 6병" 등 패턴 감지
  var budgetMatch = msg.match(/([\d,]+)\s*만\s*원|([\d,]+)\s*원/);
  var countMatch  = msg.match(/(\d+)\s*병/);
  if (!budgetMatch || !countMatch) return null;

  var budget = 0;
  if (budgetMatch[1]) {
    budget = parseInt(budgetMatch[1].replace(/,/g,'')) * 10000;
  } else if (budgetMatch[2]) {
    budget = parseInt(budgetMatch[2].replace(/,/g,''));
  }
  var count = parseInt(countMatch[1]);
  if (budget < 5000 || count < 1 || count > 30) return null;
  return { budget: budget, count: count };
}

function calcOptimalWines(budget, count) {
  // 국가별 배분
  var roCount = Math.round(count * 0.5);
  var clCount = Math.round(count * 0.3);
  var etcCount = count - roCount - clCount;

  // 벌크 와인 중 가격 있는 것만
  var validWines = WINES.filter(function(w){
    if (!w.vip_price || w.vip_price <= 0) return false;
    var n = w.name || '';
    // 대용량(5L) 와인 제외
    if (n.indexOf('5L') !== -1 || n.indexOf('5l') !== -1) return false;
    return true;
  });

  var roWines  = validWines.filter(function(w){ return w.category === 'ROMANIAN WINE'; });
  var clWines  = validWines.filter(function(w){ return w.category === 'CHILEAN WINE'; });
  var etcWines = validWines.filter(function(w){
    return w.category !== 'ROMANIAN WINE' && w.category !== 'CHILEAN WINE' && w.category !== 'COGNAC/BRANDY';
  });

  // 그리디: 예산 내에서 총합이 최대가 되도록 (= 예산에 가장 근접하도록)
  function pickWines(pool, n, remainBudget, usedIds) {
    // 병당 가이드 가격 = 잔여예산 / 잔여병수
    var perGuide = remainBudget / n;
    // 가이드 가격에 가까운 순서로 정렬
    var sorted = pool
      .filter(function(w){ return usedIds.indexOf(w.id) === -1; })
      .sort(function(a, b){ return Math.abs(a.vip_price - perGuide) - Math.abs(b.vip_price - perGuide); });

    var picked = [];
    var spent = 0;
    var remaining = remainBudget;
    var rem = n;

    for (var i = 0; i < sorted.length && picked.length < n; i++) {
      var w = sorted[i];
      // 남은 병수 * 최소가격도 고려해서 예산 초과 방지
      if (spent + w.vip_price <= remainBudget) {
        picked.push(w);
        spent += w.vip_price;
        remaining -= w.vip_price;
        rem--;
        usedIds.push(w.id);
        // 남은 병수 기준으로 재정렬
        if (rem > 0) {
          var perGuide2 = remaining / rem;
          sorted = sorted
            .filter(function(x){ return usedIds.indexOf(x.id) === -1; })
            .sort(function(a, b){ return Math.abs(a.vip_price - perGuide2) - Math.abs(b.vip_price - perGuide2); });
          i = -1; // 재정렬 후 처음부터
        }
      }
    }
    // 부족하면 예산 초과여도 가장 가까운 것으로 채움
    if (picked.length < n) {
      var remain2 = pool.filter(function(w){ return usedIds.indexOf(w.id) === -1; });
      remain2.sort(function(a,b){ return a.vip_price - b.vip_price; });
      for (var j = 0; j < remain2.length && picked.length < n; j++) {
        picked.push(remain2[j]);
        usedIds.push(remain2[j].id);
      }
    }
    return picked;
  }

  var usedIds = [];
  var roPicked  = pickWines(roWines,  roCount,  budget * 0.5,  usedIds);
  var clPicked  = pickWines(clWines,  clCount,  budget * 0.3,  usedIds);
  var etcPicked = pickWines(etcWines, etcCount, budget * 0.2,  usedIds);

  var all = roPicked.concat(clPicked).concat(etcPicked);
  var total = all.reduce(function(s, w){ return s + w.vip_price; }, 0);

  // 총합이 예산보다 낮으면 남은 예산으로 더 비싼 와인으로 교체 시도
  var diff = budget - total;
  if (diff > 0) {
    for (var k = 0; k < all.length; k++) {
      var w0 = all[k];
      var upgrades = validWines.filter(function(u){
        return usedIds.indexOf(u.id) === -1 && u.vip_price > w0.vip_price && (total - w0.vip_price + u.vip_price) <= budget;
      });
      if (upgrades.length > 0) {
        upgrades.sort(function(a,b){ return b.vip_price - a.vip_price; });
        var best = upgrades[0];
        total = total - w0.vip_price + best.vip_price;
        usedIds[usedIds.indexOf(w0.id)] = best.id;
        all[k] = best;
        diff = budget - total;
      }
    }
  }

  return { wines: all, total: total };
}

function sm(){
  var v=inpEl.value.trim();
  if(!v)return;
  inpEl.value='';
  addMsg('user',v,[],[]);

  var bq = detectBudgetQuery(v);
  if (bq) {
    var result = calcOptimalWines(bq.budget, bq.count);
    var ids = result.wines.map(function(w){ return w.id; });
    var total = result.total;
    // AI에게 정확한 조합 주입
    var injected = v + '\n\n[시스템 사전계산 결과] 총예산 ' + bq.budget.toLocaleString() + '원, ' + bq.count + '병 최적 조합:\n';
    result.wines.forEach(function(w, i){
      injected += (i+1) + '. id=' + w.id + ' ' + w.name + ' ' + w.vip_price.toLocaleString() + '원\n';
    });
    injected += '합계: ' + total.toLocaleString() + '원 (VAT별도)\n';
    injected += '이 와인들을 추천하고, 각 와인의 특징을 간결하게 설명하세요. [WINE_IDS:' + ids.join(',') + ']를 반드시 포함하세요.';
    call(injected, v);
  } else {
    call(v, v);
  }
}

}
